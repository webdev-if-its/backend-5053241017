services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: rahasia
      POSTGRES_DB: taskmanager
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager -d taskmanager"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
